<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zealoop theme lab — derivation across brand colors</title>
  <style>
    body { margin: 0; padding: 28px; font-family: -apple-system, "Segoe UI", sans-serif; background: #eceae7; color: #1c1917; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 26px 0 10px; }
    h2 small { color: #78716c; font-weight: 400; }
    .intro { font-size: 12.5px; color: #57534e; max-width: 640px; }
    .pair { display: flex; gap: 14px; flex-wrap: wrap; }
    .cell { flex: 1; min-width: 300px; border-radius: 14px; padding: 16px; }
    .cell-head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .raw { width: 18px; height: 18px; border-radius: 5px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
    .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; background: #fef3c7; color: #92400e; padding: 2px 7px; border-radius: 999px; }
    .badge.ok { background: #d1fae5; color: #065f46; }
    .ratios { font-size: 11.5px; margin: 6px 0 12px; }
    .card { padding: 14px; font-size: 13.5px; margin-bottom: 10px; }
    .bubble { padding: 10px 14px; font-size: 13.5px; display: inline-block; margin-bottom: 12px; }
    .btn { border: none; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: default; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Theme lab</h1>
  <div id="app"></div>
  <script src="/widget/theme-lab.js"></script>
</body>
</html>
